<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glass Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      overflow: hidden;
      position: relative;
    }

    /* Animated background orbs */
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.6;
      animation: float 12s ease-in-out infinite;
    }

    .orb-1 {
      width: 400px;
      height: 400px;
      background: #6366f1;
      top: -100px;
      left: -100px;
      animation-delay: 0s;
    }

    .orb-2 {
      width: 350px;
      height: 350px;
      background: #ec4899;
      bottom: -80px;
      right: -80px;
      animation-delay: -4s;
    }

    .orb-3 {
      width: 250px;
      height: 250px;
      background: #06b6d4;
      top: 40%;
      left: 60%;
      animation-delay: -8s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -40px) scale(1.05); }
      66% { transform: translate(-20px, 20px) scale(0.95); }
    }

    .calculator {
      position: relative;
      width: 340px;
      padding: 28px 24px 24px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      z-index: 10;
    }

    .display {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 18px;
      padding: 20px 22px;
      margin-bottom: 22px;
      text-align: right;
      border: 1px solid rgba(255, 255, 255, 0.08);
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 6px;
    }

    .expression {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.55);
      font-weight: 400;
      min-height: 22px;
      word-break: break-all;
      letter-spacing: 0.3px;
    }

    .result {
      font-size: 42px;
      font-weight: 500;
      color: #fff;
      letter-spacing: -0.5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: font-size 0.15s ease;
    }

    .result.long {
      font-size: 28px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      aspect-ratio: 1;
      border: none;
      border-radius: 16px;
      font-size: 22px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.18s ease;
      position: relative;
      overflow: hidden;
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    button:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }

    button:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.22);
    }

    button.operator {
      background: rgba(99, 102, 241, 0.35);
      border-color: rgba(99, 102, 241, 0.4);
      color: #c7d2fe;
    }

    button.operator:hover {
      background: rgba(99, 102, 241, 0.5);
    }

    button.equals {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      box-shadow: 0 4px 18px rgba(99, 102, 241, 0.45);
      color: #fff;
    }

    button.equals:hover {
      background: linear-gradient(135deg, #818cf8, #a78bfa);
      box-shadow: 0 6px 22px rgba(99, 102, 241, 0.55);
    }

    button.clear {
      background: rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    button.clear:hover {
      background: rgba(239, 68, 68, 0.4);
    }

    button.zero {
      grid-column: span 2;
      aspect-ratio: auto;
      height: 100%;
    }

    button.func {
      background: rgba(255, 255, 255, 0.07);
      color: rgba(255, 255, 255, 0.75);
      font-size: 18px;
    }

    /* Ripple effect */
    button .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      transform: scale(0);
      animation: ripple 0.5s linear;
      pointer-events: none;
    }

    @keyframes ripple {
      to {
        transform: scale(3.5);
        opacity: 0;
      }
    }

    /* Subtle shine */
    .calculator::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 40%;
      border-radius: 28px 28px 0 0;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.08) 0%,
        transparent 100%
      );
      pointer-events: none;
    }

    @media (max-width: 400px) {
      .calculator {
        width: 92vw;
        padding: 22px 18px 18px;
      }

      .result {
        font-size: 36px;
      }

      button {
        font-size: 20px;
        border-radius: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>

    <div class="buttons">
      <button class="clear" data-action="clear">AC</button>
      <button class="func" data-action="toggle-sign">±</button>
      <button class="func" data-action="percent">%</button>
      <button class="operator" data-action="operator" data-value="/">÷</button>

      <button data-action="number" data-value="7">7</button>
      <button data-action="number" data-value="8">8</button>
      <button data-action="number" data-value="9">9</button>
      <button class="operator" data-action="operator" data-value="*">×</button>

      <button data-action="number" data-value="4">4</button>
      <button data-action="number" data-value="5">5</button>
      <button data-action="number" data-value="6">6</button>
      <button class="operator" data-action="operator" data-value="-">−</button>

      <button data-action="number" data-value="1">1</button>
      <button data-action="number" data-value="2">2</button>
      <button data-action="number" data-value="3">3</button>
      <button class="operator" data-action="operator" data-value="+">+</button>

      <button class="zero" data-action="number" data-value="0">0</button>
      <button data-action="decimal">.</button>
      <button class="equals" data-action="equals">=</button>
    </div>
  </div>

  <script>
    const expressionEl = document.getElementById('expression');
    const resultEl = document.getElementById('result');

    let current = '0';
    let previous = null;
    let operator = null;
    let shouldReset = false;
    let expression = '';

    function updateDisplay() {
      resultEl.textContent = formatNumber(current);
      resultEl.classList.toggle('long', current.length > 10);
      expressionEl.textContent = expression;
    }

    function formatNumber(numStr) {
      if (numStr === 'Error') return numStr;
      const num = parseFloat(numStr);
      if (isNaN(num)) return numStr;

      // Keep scientific for very large/small
      if (Math.abs(num) >= 1e12 || (Math.abs(num) < 1e-6 && num !== 0)) {
        return num.toExponential(6);
      }

      // Limit decimal places for display
      const str = num.toString();
      if (str.includes('e')) return str;

      const parts = str.split('.');
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      return parts.join('.');
    }

    function inputNumber(value) {
      if (shouldReset) {
        current = value;
        shouldReset = false;
      } else {
        if (current === '0' && value !== '0') {
          current = value;
        } else if (current === '0' && value === '0') {
          return;
        } else {
          if (current.replace('.', '').length >= 12) return;
          current += value;
        }
      }
      updateDisplay();
    }

    function inputDecimal() {
      if (shouldReset) {
        current = '0.';
        shouldReset = false;
      } else if (!current.includes('.')) {
        current += '.';
      }
      updateDisplay();
    }

    function setOperator(op) {
      if (operator && !shouldReset) {
        calculate();
      }

      previous = current;
      operator = op;
      shouldReset = true;

      const symbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
      expression = `${formatNumber(previous)} ${symbols[op]}`;
      updateDisplay();
    }

    function calculate() {
      if (operator === null || previous === null) return;

      const a = parseFloat(previous);
      const b = parseFloat(current);
      let result;

      switch (operator) {
        case '+': result = a + b; break;
        case '-': result = a - b; break;
        case '*': result = a * b; break;
        case '/':
          if (b === 0) {
            current = 'Error';
            expression = '';
            operator = null;
            previous = null;
            shouldReset = true;
            updateDisplay();
            return;
          }
          result = a / b;
          break;
        default: return;
      }

      // Clean floating point
      result = Math.round(result * 1e10) / 1e10;

      const symbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
      expression = `${formatNumber(previous)} ${symbols[operator]} ${formatNumber(current)} =`;

      current = result.toString();
      operator = null;
      previous = null;
      shouldReset = true;
      updateDisplay();
    }

    function clearAll() {
      current = '0';
      previous = null;
      operator = null;
      shouldReset = false;
      expression = '';
      updateDisplay();
    }

    function toggleSign() {
      if (current === '0' || current === 'Error') return;
      current = current.startsWith('-') ? current.slice(1) : '-' + current;
      updateDisplay();
    }

    function percent() {
      if (current === 'Error') return;
      current = (parseFloat(current) / 100).toString();
      updateDisplay();
    }

    // Button click handling + ripple
    document.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', (e) => {
        // Ripple
        const ripple = document.createElement('span');
        ripple.classList.add('ripple');
        const rect = btn.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
        ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
        btn.appendChild(ripple);
        setTimeout(() => ripple.remove(), 500);

        const action = btn.dataset.action;
        const value = btn.dataset.value;

        switch (action) {
          case 'number': inputNumber(value); break;
          case 'decimal': inputDecimal(); break;
          case 'operator': setOperator(value); break;
          case 'equals': calculate(); break;
          case 'clear': clearAll(); break;
          case 'toggle-sign': toggleSign(); break;
          case 'percent': percent(); break;
        }
      });
    });

    // Keyboard support
    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') inputNumber(e.key);
      else if (e.key === '.') inputDecimal();
      else if (e.key === '+') setOperator('+');
      else if (e.key === '-') setOperator('-');
      else if (e.key === '*') setOperator('*');
      else if (e.key === '/') { e.preventDefault(); setOperator('/'); }
      else if (e.key === 'Enter' || e.key === '=') calculate();
      else if (e.key === 'Escape' || e.key === 'c' || e.key === 'C') clearAll();
      else if (e.key === 'Backspace') {
        if (!shouldReset && current.length > 1) {
          current = current.slice(0, -1);
        } else {
          current = '0';
        }
        updateDisplay();
      }
      else if (e.key === '%') percent();
    });

    updateDisplay();
  </script>
</body>
</html>
