name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run calculator tests
        run: node calculator/calc.test.js
      - name: Check required files exist
        run: |
          test -f calculator/index.html
          test -f calculator/styles.css
          test -f calculator/calc.js
          test -f calculator/app.js
